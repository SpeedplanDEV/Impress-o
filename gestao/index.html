<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#002AFF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>SpeedPlan Gestão</title>
    <script>
      // Aplica tema e cor antes da primeira pintura (evita piscar)
      try {
        var t = localStorage.getItem('sp:tema') || 'claro'
        document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : t === 'night' ? 'night' : 'light'
        var c = { azul: ['#002AFF', '#0022CC'], indigo: ['#4F46E5', '#4338CA'], verde: ['#047857', '#065F46'], laranja: ['#C2410C', '#9A3412'] }[localStorage.getItem('sp:cor') || 'azul']
        if (c) { document.documentElement.style.setProperty('--primary', c[0]); document.documentElement.style.setProperty('--primary-hover', c[1]) }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
